name: Deploy — Linha do Tempo Perfeita

on:
  push:
    branches: [main]
    paths:
      - 'linha-do-tempo/app/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: linha-do-tempo/app/package-lock.json

      - name: Install dependencies
        run: cd linha-do-tempo/app && npm ci

      - name: Build
        run: cd linha-do-tempo/app && npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: linha-do-tempo/app/dist
          destination_dir: ldt
          commit_message: 'deploy: Linha do Tempo Perfeita [${{ github.sha }}]'

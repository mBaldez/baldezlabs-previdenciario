name: Análise Semanal de Concorrentes

on:
  schedule:
    # Todo domingo às 08:00 (horário de Brasília = 11:00 UTC)
    - cron: '0 11 * * 0'
  workflow_dispatch:  # Permite rodar manualmente

jobs:
  analisar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install instaloader

      - name: Executar análise de concorrentes
        run: python scripts/analise_concorrencia.py

      - name: Commit e push dos resultados
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add dados/temas_em_alta.json
          git diff --staged --quiet || git commit -m "🤖 Atualiza temas em alta - $(date +'%Y-%m-%d')"
          git push

name: Analise Semanal de Mercado

on:
  schedule:
    - cron: '0 11 * * 0'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analisar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pytrends "urllib3<2"

      - name: Executar analise Google Trends
        run: python scripts/analise_concorrencia.py
        continue-on-error: true

      - name: Atualizar data mesmo sem novos dados
        run: |
          python3 -c "
import json, os
from datetime import datetime
path = 'dados/temas_em_alta.json'
if os.path.exists(path):
    with open(path) as f:
        data = json.load(f)
    data['ultima_tentativa'] = datetime.now().strftime('%Y-%m-%d')
    with open(path, 'w') as f:
        json.dump(data, f, ensure_ascii=False, indent=2)
"

      - name: Commit e push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add dados/temas_em_alta.json
          git diff --staged --quiet || git commit -m "Verificacao semanal - $(date +'%Y-%m-%d')"
          git push

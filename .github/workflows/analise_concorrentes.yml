name: Análise Semanal de Mercado

on:
  schedule:
    # Todo domingo às 08:00 (horário de Brasília = 11:00 UTC)
    - cron: '0 11 * * 0'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analisar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Executar análise de mercado
        env:
          CONCORRENTES_LIST: ${{ secrets.CONCORRENTES_LIST }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/analise_concorrencia.py

      - name: Commit e push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add dados/temas_em_alta.json
          git diff --staged --quiet || git commit -m "🤖 Atualiza temas em alta — $(date +'%Y-%m-%d')"
          git push
